version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgresDB
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

#To run 
#docker compose up -d
#docker ps
